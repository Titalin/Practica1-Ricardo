<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Carrera</title>
    <link rel="stylesheet" href="carreras.css">
</head>
<body>
    <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="index.html">Carreras</a></li>
        <li><a href="../division/index.html">Divisiones</a></li>
    </ul>

    <main class="main-content">
        <h1>Crear Carrera</h1>
        <form action="/admin/carrera/create" method="post">
            <label for="name">Nombre de la Carrera:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="description">Descripción:</label>
            <input type="text" id="description" name="description" required>

            <label for="division_id">División a la que pertenece:</label>
            <select id="division_id" name="division_id" required>
                <option value="" disabled selected>-- Seleccione una división --</option>
            </select>
            
            <button type="submit">Crear</button>
        </form>
    </main>
</body>
</html>
