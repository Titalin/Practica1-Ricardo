<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar División</title>
</head>
<body>
    <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../carrera/index.html">Carreras</a></li>
        <li><a href="index.html">Divisiones</a></li>
    </ul>
    <form action="/admin/division/update" method="post">
        <input type="hidden" name="id" value="${division.id}">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" value="${division.name}" required>
        <label for="description">Descripción:</label>
        <input type="text" id="description" name="description" value="${division.description}" required>
        <button type="submit">Actualizar</button>
    </form>
</body>
</html>
